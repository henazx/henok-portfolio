  </g>

  <text x="600" y="500" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="6">PROJECT PREVIEW</text>
  <text x="600" y="540" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="3">UPLOAD AN IMAGE IN THE EDITOR</text>
